name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Drone-swarm-v1/computer_code/package-lock.json

      - name: Install Python dependencies
        working-directory: Drone-swarm-v1/computer_code/api
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: Drone-swarm-v1/computer_code
        run: npm ci

      - name: Run test gate
        run: ./run_tests.ps1
