name: Build and publish desktop releases

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            artifact: DroneSwarm-Windows-x64.exe
          - platform: ubuntu-x64
            runner: ubuntu-22.04
            artifact: DroneSwarm-Ubuntu-x64.tar.gz

    defaults:
      run:
        working-directory: Drone-swarm-v1/computer_code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            Drone-swarm-v1/computer_code/api/requirements.txt
            Drone-swarm-v1/computer_code/api/requirements-build.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Drone-swarm-v1/computer_code/package-lock.json

      - name: Build React frontend
        run: |
          npm ci
          npm run build

      - name: Install Python build dependencies
        run: python -m pip install -r api/requirements.txt -r api/requirements-build.txt

      - name: Build native executable
        run: >-
          python -m PyInstaller api/droneswarm.spec
          --noconfirm
          --clean
          --distpath dist_exe
          --workpath build/pyinstaller

      - name: Name Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist_exe/DroneSwarm.exe ${{ matrix.artifact }}

      - name: Package Ubuntu release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x dist_exe/DroneSwarm
          tar -C dist_exe -czf "${{ matrix.artifact }}" DroneSwarm

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: Drone-swarm-v1/computer_code/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to S3 and refresh CloudFront
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release metadata
        shell: bash
        run: |
          cd release-assets
          sha256sum DroneSwarm-Windows-x64.exe DroneSwarm-Ubuntu-x64.tar.gz > checksums.txt
          cat > version.json <<EOF
          {
            "version": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "built_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload latest release
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: >-
          aws s3 cp release-assets "s3://${AWS_S3_BUCKET}/latest/"
          --recursive
          --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload immutable tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: >-
          aws s3 cp release-assets "s3://${AWS_S3_BUCKET}/releases/${GITHUB_REF_NAME}/"
          --recursive
          --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront latest files
        env:
          DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${DISTRIBUTION_ID}"
          --paths "/latest/*"
