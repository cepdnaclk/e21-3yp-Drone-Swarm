name: Build and Release Desktop App

# Push to main       -> rebuilds and overwrites the `latest/` downloads.
# Push a tag "vX.Y.Z" -> also publishes a permanent `releases/vX.Y.Z/` copy.
#
# AWS upload steps are skipped automatically until the AWS_* repository secrets
# are set, so this workflow is safe to merge before the S3/CloudFront setup is
# done — it will still build and attach the executables as GitHub artifacts.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write   # lets you switch to AWS OIDC roles later without editing perms

defaults:
  run:
    working-directory: Drone-swarm-v1/computer_code

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: DroneSwarm-Windows-x64.exe
            binary: DroneSwarm.exe
          - os: ubuntu-22.04
            artifact: DroneSwarm-Ubuntu-x64.tar.gz
            binary: DroneSwarm
    runs-on: ${{ matrix.os }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV runtime libs (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build React frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend and build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r api/requirements-build.txt

      - name: Build executable with PyInstaller
        run: pyinstaller api/droneswarm.spec --noconfirm

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/${{ matrix.binary }} release/${{ matrix.artifact }}
          (Get-FileHash release/${{ matrix.artifact }} -Algorithm SHA256).Hash.ToLower() `
            | Out-File -Encoding ascii release/${{ matrix.artifact }}.sha256

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          chmod +x dist/${{ matrix.binary }}
          tar -C dist -czf release/${{ matrix.artifact }} ${{ matrix.binary }}
          sha256sum release/${{ matrix.artifact }} | awk '{print $1}' > release/${{ matrix.artifact }}.sha256

      - name: Upload GitHub build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Drone-swarm-v1/computer_code/release/${{ matrix.artifact }}*

      - name: Configure AWS credentials
        if: env.AWS_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3 (latest/)
        if: env.AWS_S3_BUCKET != ''
        run: |
          aws s3 cp release/${{ matrix.artifact }} s3://${{ env.AWS_S3_BUCKET }}/latest/${{ matrix.artifact }}
          aws s3 cp release/${{ matrix.artifact }}.sha256 s3://${{ env.AWS_S3_BUCKET }}/latest/${{ matrix.artifact }}.sha256

      - name: Upload to S3 (versioned release)
        if: env.AWS_S3_BUCKET != '' && startsWith(github.ref, 'refs/tags/v')
        run: |
          aws s3 cp release/${{ matrix.artifact }} s3://${{ env.AWS_S3_BUCKET }}/releases/${{ github.ref_name }}/${{ matrix.artifact }}
          aws s3 cp release/${{ matrix.artifact }}.sha256 s3://${{ env.AWS_S3_BUCKET }}/releases/${{ github.ref_name }}/${{ matrix.artifact }}.sha256

  publish-version-and-invalidate:
    needs: build
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Configure AWS credentials
        if: env.AWS_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write version.json to latest/
        if: env.AWS_S3_BUCKET != ''
        working-directory: ${{ runner.temp }}
        run: |
          printf '{"version":"%s","commit":"%s","built_at":"%s"}\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          aws s3 cp version.json s3://${AWS_S3_BUCKET}/latest/version.json

      - name: Invalidate CloudFront cache for latest/*
        if: env.AWS_CLOUDFRONT_DISTRIBUTION_ID != ''
        working-directory: ${{ runner.temp }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${AWS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/latest/*"
